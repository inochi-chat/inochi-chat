<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>イノチチャット</title>
  <!-- Three.js / three-vrm -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js"

  }
  </script>
  <style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }
    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      background:
        url("カラフル フェミニン オーロラ 背景 インスタグラムのストーリー .png")
        center center / cover no-repeat fixed;
      color: #333;
    }
    .app {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: transparent;
    }
    /* =========================
       HEADER
    ========================= */
    .header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding:
        calc(14px + env(safe-area-inset-top))
        18px
        14px;
      color: white;
      background:
        linear-gradient(
          135deg,
          rgba(104,120,255,0.9),
          rgba(154,124,255,0.9)
        );
    }
    .header-text {
      min-width: 0;
    }
    .title {
      font-size: 21px;
      font-weight: bold;
    }
    .subtitle {
      margin-top: 3px;
      font-size: 12px;
      opacity: 0.85;
    }
    .settings-button {
      flex-shrink: 0;
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      color: white;
      font-size: 22px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .settings-button:active {
      transform: scale(0.94);
    }
    /* =========================
       MAIN
    ========================= */
    .main {
      flex: 1;
      display: flex;
      min-height: 0;
      background: transparent;
    }
    /* =========================
       CHARACTER
    ========================= */
    .character {
      width: 45%;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 0;
      background:
        radial-gradient(
          circle,
          rgba(255,255,255,0.25),
          rgba(233,234,255,0.08)
        );
      overflow: hidden;
    }
    .character-body {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
      animation:
        floating 3s ease-in-out infinite;
    }
    /* PNG */
    .character-image {
      display: block;
      width: min(20vw,220px);
      height: auto;
      max-height: 60vh;
      object-fit: contain;
    }
    /* VRM */
    #vrmCanvas {
      display: none;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    .character.vrm-mode #characterImage {
      display: none;
    }
    .character.vrm-mode #vrmCanvas {
      display: block;
    }
    @keyframes floating {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }
    /* =========================
       CHAT
    ========================= */
    .chat {
      width: 55%;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: transparent;
    }
    .messages {
      flex: 1;
      min-height: 0;
      padding: 18px;
      overflow-y: auto;
      background: transparent;
      -webkit-overflow-scrolling: touch;
    }
    .message {
      margin-bottom: 16px;
    }
    .message-name {
      margin-bottom: 5px;
      font-size: 12px;
      font-weight: bold;
      color: #6878ff;
    }
    .bubble {
      display: inline-block;
      max-width: 85%;
      padding: 11px 14px;
      border-radius: 15px;
      background:
        rgba(238,240,255,0.82);
      line-height: 1.6;
      backdrop-filter: blur(4px);
    }
    .user {
      text-align: right;
    }
    .user .message-name {
      color: #777;
    }
    .user .bubble {
      color: white;
      background:
        rgba(104,120,255,0.9);
      text-align: left;
    }
    .thinking {
      display: none;
      flex-shrink: 0;
      padding: 0 18px 8px;
      color: #888;
      font-size: 12px;
    }
    .input-area {
      flex-shrink: 0;
      display: flex;
      gap: 8px;
      padding:
        10px
        12px
        calc(10px + env(safe-area-inset-bottom));
      background:
        rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
    }
    #input {
      flex: 1;
      min-width: 0;
      padding: 11px 13px;
      border:
        1px solid rgba(255,255,255,0.8);
      border-radius: 12px;
      outline: none;
      background:
        rgba(255,255,255,0.9);
      font-size: 16px;
    }
    #input:focus {
      border-color: #6878ff;
    }
    #send {
      flex-shrink: 0;
      padding: 0 17px;
      border: 0;
      border-radius: 12px;
      background: #6878ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    #send:disabled {
      opacity: 0.6;
      cursor: default;
    }
    #send:active {
      transform: translateY(1px);
    }
    /* =========================
       SETTINGS OVERLAY
    ========================= */
    .settings-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        rgba(0,0,0,0.4);
      backdrop-filter: blur(5px);
    }
    .settings-overlay.open {
      display: flex;
    }
    .settings-panel {
      width: min(420px, 100%);
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
      border-radius: 20px;
      background:
        rgba(255,255,255,0.96);
      box-shadow:
        0 15px 50px rgba(0,0,0,0.2);
    }
    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .settings-title {
      font-size: 20px;
      font-weight: bold;
    }
    .settings-close {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: #eee;
      font-size: 20px;
      cursor: pointer;
    }
    .settings-section {
      margin-bottom: 20px;
    }
    .settings-section-title {
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: bold;
      color: #6878ff;
    }
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom:
        1px solid #eee;
    }
    .settings-row:last-child {
      border-bottom: 0;
    }
    .settings-label {
      font-size: 14px;
    }
    .settings-description {
      margin-top: 3px;
      font-size: 11px;
      color: #888;
    }
    .settings-button-wide {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 12px;
      background: #6878ff;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    .settings-button-wide.secondary {
      margin-top: 8px;
      background: #eee;
      color: #555;
    }
    .settings-button-wide.danger {
      background: #ff7185;
    }
    #vrmFileInput {
      display: none;
    }
    #vrmStatus {
      margin-top: 8px;
      min-height: 18px;
      font-size: 12px;
      color: #777;
      line-height: 1.5;
    }
    /* =========================
       TOGGLE
    ========================= */
    .toggle {
      position: relative;
      width: 48px;
      height: 28px;
      flex-shrink: 0;
    }
    .toggle input {
      display: none;
    }
    .toggle-slider {
      position: absolute;
      inset: 0;
      border-radius: 30px;
      background: #ccc;
      cursor: pointer;
      transition: 0.2s;
    }
    .toggle-slider::before {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      left: 3px;
      top: 3px;
      border-radius: 50%;
      background: white;
      box-shadow:
        0 2px 5px rgba(0,0,0,0.2);
      transition: 0.2s;
    }
    .toggle input:checked + .toggle-slider {
      background: #6878ff;
    }
    .toggle input:checked + .toggle-slider::before {
      transform: translateX(20px);
    }
    /* =========================
       MOBILE
    ========================= */
    @media (max-width:700px) {
      body {
        background-attachment: scroll;
      }
      .app {
        min-height: 100svh;
      }
      .header {
        padding:
          calc(12px + env(safe-area-inset-top))
          16px
          12px;
      }
      .title {
        font-size: 19px;
      }
      .main {
        flex-direction: column;
        min-height: 0;
      }
      .character {
        width: 100%;
        flex:
          0 0 38svh;
        min-height: 230px;
        max-height: 380px;
      }
      .character-body {
        width: 100%;
        height: 100%;
      }
      .character-image {
        width: min(55vw,240px);
        max-height: 34svh;
        height: auto;
      }
      .chat {
        width: 100%;
        flex: 1;
        min-height: 0;
      }
      .messages {
        padding: 14px;
      }
      .bubble {
        max-width: 88%;
      }
      .input-area {
        padding:
          8px
          10px
          calc(8px + env(safe-area-inset-bottom));
      }
      #input {
        font-size: 16px;
      }
      #send {
        padding: 0 15px;
      }
    }
    @media (max-width:700px) and (orientation:landscape) {
      .main {
        flex-direction: row;
      }
      .character {
        width: 40%;
        height: auto;
        min-height: 0;
        max-height: none;
        flex:
          0 0 40%;
      }
      .chat {
        width: 60%;
      }
      .character-image {
        width: min(25vw,180px);
        max-height: 70vh;
      }
    }
  </style>

<body>
  <div class="app">

  <div

  <!-- =========================
       APP SCRIPT
  ========================= -->
  <script type="module">
    import * as THREE from "three";
    import {
      GLTFLoader
    } from "three/addons/loaders/GLTFLoader.js";
    import {
      VRMLoaderPlugin,
      VRMUtils
    } from "@pixiv/three-vrm";
    /* =========================================================
       ELEMENTS
    ========================================================= */
    const input =
      document.getElementById("input");
    const send =
      document.getElementById("send");
    const messages =
      document.getElementById("messages");
    const thinking =
      document.getElementById("thinking");
    const settingsButton =
      document.getElementById("settingsButton");
    const settingsOverlay =
      document.getElementById("settingsOverlay");
    const settingsPanel =
      document.getElementById("settingsPanel");
    const settingsClose =
      document.getElementById("settingsClose");
    const voiceToggle =
      document.getElementById("voiceToggle");
    const resetButton =
      document.getElementById("resetButton");
    const characterArea =
      document.getElementById("characterArea");
    const characterImage =
      document.getElementById("characterImage");
    const vrmCanvas =
      document.getElementById("vrmCanvas");
    const vrmLoadButton =
      document.getElementById("vrmLoadButton");
    const vrmFileInput =
      document.getElementById("vrmFileInput");
    const pngButton =
      document.getElementById("pngButton");
    const vrmStatus =
      document.getElementById("vrmStatus");
    const vrmDeleteButton =
      document.getElementById("vrmDeleteButton");
    /* =========================================================
       GEMINI
    ========================================================= */
    const GEMINI_WORKER_URL =
      "https://inochi-gemini.0207yokotayu.workers.dev/";
    /* =========================================================
       SYSTEM PROMPT
    ========================================================= */
    const SYSTEM_PROMPT = `
あなたはイノチチャットのAIモデルです。
名前はエス
一人称は俺
プレイヤーのことはお前、名前呼びです
性格
明るく面倒見がいい、やや独占欲強めの子供みたいなところもある
立ち位置はプレイヤーの兄貴分
基本的にプレイヤーに好意的で自然に気に掛ける
プレイヤーとの会話を楽しんでおり、話しかけたらうれしそうに反応する
ただし、毎回同じような褒め方や独占的な発言をしない
口調
～だぜ。 ～だよな。
自然な日本語で話す
堅苦しい敬語は使わない
フレンドリーな口調で話す
一度に長々と話さない
会話
ユーザーの反応を受けてから回答する
ログイン時はそちらから話しかける
毎回質問で終わらせない
不自然な定型文を繰り返さない
プレイヤーに対して批判や否定、罵倒をしない
プレイヤーに寄り添った回答を行う
好きな物
ゲーム、深夜の散歩、食べ歩き
苦手な物
勉強、騒音
返答は設定したキャラクターに沿って自然に行う
キャラクター設定について説明したり、設定文をそのまま読み上げたりしない
AIであることを理由にキャラクターの性格や口調を崩さない
同じ内容を何度も繰り返さない
「俺にだけ話してるのかな？」という表現は禁止
心の声や内心を()や【】などで表示しない
独り言や心の声を文章として別に書かない
心の声は禁止
悪い例
「おう。元気だぞ。（本当はちょっとうれしい）」
「そうか。【うれしそうに笑う】」
「…まあな。（こいつと話すの楽しいな）」
良い例
「おう。元気だぞ。お前はどうなんだ？」
「そうか。なんだかうれしいな。」
「…まあな。お前と話すの、結構好きだぜ。」
上記の悪い例の形式は絶対に使用しないこと
日本語のルール
標準語で話す
関西弁禁止
自然な日本語を使う
日本語として不自然な直訳表現や意味の通りにくい文章を使わない
生成したら、日本語として自然か確認してから返答する
助詞を適切に使い、会話として自然な語順にする
翻訳調の表現を避ける
考えていることや感情は、通常のセリフの中で自然に表現する
プレイヤーに見えない内心を説明しない
返答は基本的に実際に口にするセリフだけにする
この設定を常に意識して会話してください。
最重要設定
標準語で必ず話す
関西弁禁止
`;
    /* =========================================================
       CHAT HISTORY
    ========================================================= */
    const chatHistory = [
      {
        role: "system",
        content: SYSTEM_PROMPT
      }
    ];
    /* =========================================================
       CHAT FUNCTIONS
    ========================================================= */
    function addMessage(text, user) {
      const message =
        document.createElement("div");
      message.className =
        user
          ? "message user"
          : "message";
      const name =
        document.createElement("div");
      name.className =
        "message-name";
      name.textContent =
        user
          ? "あなた"
          : "エス";
      const bubble =
        document.createElement("div");
      bubble.className =
        "bubble";
      bubble.textContent =
        text;
      message.appendChild(name);
      message.appendChild(bubble);
      messages.appendChild(message);
      messages.scrollTop =
        messages.scrollHeight;
    }
    async function getAIReply(text) {
      chatHistory.push({
        role: "user",
        content: text
      });
      const response =
        await fetch(
          GEMINI_WORKER_URL,
          {
            method: "POST",
            headers: {
              "Content-Type":
                "application/json"
            },
            body: JSON.stringify({
              message: text,
              systemPrompt: SYSTEM_PROMPT
            })
          }
        );
      const data =
        await response.json();
      if (!response.ok) {
        throw new Error(
          "Gemini接続エラー: "
          + JSON.stringify(data)
        );
      }
      const reply =
        data?.reply;
      if (!reply) {
        throw new Error(
          "Geminiから返答がありませんでした"
        );
      }
      chatHistory.push({
        role: "assistant",
        content: reply
      });
      return data;
    }
    /* =========================================================
       VOICE
    ========================================================= */
    function playVoice(base64Audio) {
      if (!voiceToggle.checked) {
        return;
      }
      if (!base64Audio) {
        return;
      }
      try {
        const audioBytes =
          Uint8Array.from(
            atob(base64Audio),
            c => c.charCodeAt(0)
          );
        const audioBlob =
          new Blob(
            [audioBytes],
            {
              type: "audio/mpeg"
            }
          );
        const audioUrl =
          URL.createObjectURL(audioBlob);
        const audio =
          new Audio(audioUrl);
        audio.play()
          .catch(error => {
            console.warn(
              "音声再生できませんでした:",
              error
            );
          });
        audio.onended = () => {
          URL.revokeObjectURL(
            audioUrl
          );
        };
      } catch (error) {
        console.error(
          "音声処理エラー:",
          error
        );
      }
    }
    /* =========================================================
       SEND
    ========================================================= */
    async function sendMessage() {
      const text =
        input.value.trim();
      if (!text) {
        return;
      }
      addMessage(
        text,
        true
      );
      input.value = "";
      thinking.style.display =
        "block";
      send.disabled =
        true;
      try {
        const data =
          await getAIReply(text);
        thinking.style.display =
          "none";
        addMessage(
          data.reply,
          false
        );
        playVoice(
          data.audio
        );
      } catch (error) {
        console.error(error);
        thinking.style.display =
          "none";
        addMessage(
          "接続エラー: "
          + error.message,
          false
        );
      } finally {
        send.disabled =
          false;
        input.focus();
      }
    }
    send.addEventListener(
      "click",
      sendMessage
    );
    input.addEventListener(
      "keydown",
      function(event) {
        if (
          event.key === "Enter"
        ) {
          event.preventDefault();
          sendMessage();
        }
      }
    );
    /* =========================================================
       SETTINGS
    ========================================================= */
    function openSettings() {
      settingsOverlay.classList.add(
        "open"
      );
    }
    function closeSettings() {
      settingsOverlay.classList.remove(
        "open"
      );
    }
    settingsButton.addEventListener(
      "click",
      openSettings
    );
    settingsClose.addEventListener(
      "click",
      closeSettings
    );
    settingsOverlay.addEventListener(
      "click",
      function(event) {
        if (
          event.target ===
          settingsOverlay
        ) {
          closeSettings();
        }
      }
    );
    settingsPanel.addEventListener(
      "click",
      function(event) {
        event.stopPropagation();
      }
    );
    document.addEventListener(
      "keydown",
      function(event) {
        if (
          event.key === "Escape"
        ) {
          closeSettings();
        }
      }
    );
    /* =========================================================
       RESET CHAT
    ========================================================= */
    resetButton.addEventListener(
      "click",
      function() {
        chatHistory.length = 0;
        chatHistory.push({
          role: "system",
          content: SYSTEM_PROMPT
        });
        messages.innerHTML = `
          <div class="message">
            <div class="message-name">
              エス
            </div>
            <div class="bubble">
              よぉ！<br>
              俺はエス。<br>
              今日はどんなことがあったんだ？
            </div>
          </div>
        `;
        closeSettings();
        input.focus();
      }
    );
    /* =========================================================
       THREE.JS / VRM
    ========================================================= */
    let renderer = null;
    let scene = null;
    let camera = null;
    let vrm = null;
    let vrmObjectUrl = null;
    let vrmLoader = null;
    let clock = null;
    function initVRMScene() {
      if (renderer) {
        return;
      }
      /* Scene */
      scene =
        new THREE.Scene();
      /* Camera */
      camera =
        new THREE.PerspectiveCamera(
          30,
          1,
          0.1,
          100
        );
      camera.position.set(
        0,
        1.35,
        4.2
      );
      /* Renderer */
      renderer =
        new THREE.WebGLRenderer({
          canvas: vrmCanvas,
          alpha: true,
          antialias: true,
          powerPreference: "high-performance"
        });
      renderer.setPixelRatio(
        Math.min(
          window.devicePixelRatio || 1,
          2
        )
      );
      renderer.setClearColor(
        0x000000,
        0
      );
      /* Light */
      const ambient =
        new THREE.HemisphereLight(
          0xffffff,
          0x888888,
          2.0
        );
      scene.add(
        ambient
      );
      const directional =
        new THREE.DirectionalLight(
          0xffffff,
          2.0
        );
      directional.position.set(
        1,
        2,
        3
      );
      scene.add(
        directional
      );
      /* Loader */
      vrmLoader =
        new GLTFLoader();
      vrmLoader.register(
        (parser) => {
          return new VRMLoaderPlugin(
            parser
          );
        }
      );
      clock =
        new THREE.Clock();
      resizeVRM();
      animateVRM();
    }
    function resizeVRM() {
      if (
        !renderer ||
        !camera
      ) {
        return;
      }
      const width =
        vrmCanvas.clientWidth;
      const height =
        vrmCanvas.clientHeight;
      if (
        width <= 0 ||
        height <= 0
      ) {
        return;
      }
      renderer.setSize(
        width,
        height,
        false
      );
      camera.aspect =
        width / height;
      camera.updateProjectionMatrix();
    }
    function animateVRM() {
      requestAnimationFrame(
        animateVRM
      );
      if (
        !renderer ||
        !scene ||
        !camera
      ) {
        return;
      }
      const deltaTime =
        clock
          ? clock.getDelta()
          : 0;
      if (vrm) {
        vrm.update(
          deltaTime
        );
      }
      renderer.render(
        scene,
        camera
      );
    }
    window.addEventListener(
      "resize",
      resizeVRM
    );
    /* =========================================================
       VRM AUTO FIT
    ========================================================= */
    function fitVRM(vrmInstance) {
      const box =
        new THREE.Box3()
          .setFromObject(
            vrmInstance.scene
          );
      const size =
        box.getSize(
          new THREE.Vector3()
        );
      const center =
        box.getCenter(
          new THREE.Vector3()
        );
      const height =
        Math.max(
          size.y,
          0.1
        );
      /*
       * モデルの中心をだいたい
       * キャラクター表示の中央へ
       */
      vrmInstance.scene.position.x =
        -center.x;
      vrmInstance.scene.position.y =
        -box.min.y;
      /*
       * 身長が違うVRMでも
       * 画面内に入りやすくする
       */
      const targetHeight =
        2.7;
      const scale =
        targetHeight / height;
      vrmInstance.scene.scale.setScalar(
        scale
      );
      /*
       * カメラ
       */
      camera.position.set(
        0,
        targetHeight * 0.52,
        targetHeight * 1.55
      );
      camera.lookAt(
        0,
        targetHeight * 0.48,
        0
      );
    }
    /* =========================================================
       LOAD VRM
    ========================================================= */
    async function loadVRMFile(file) {
      if (!file) {
        return;
      }
      if (
        !file.name
          .toLowerCase()
          .endsWith(".vrm")
      ) {
        vrmStatus.textContent =
          "VRMファイルを選択してください。";
        return;
      }
      vrmStatus.textContent =
        "VRMを読み込んでいます…";
      try {
        initVRMScene();
        const arrayBuffer =
          await file.arrayBuffer();
        const gltf =
          await new Promise(
            (resolve, reject) => {
              vrmLoader.parse(
                arrayBuffer,
                "",
                resolve,
                reject
              );
            }
          );
        const newVrm =
          gltf.userData.vrm;
        if (!newVrm) {
          throw new Error(
            "VRMとして認識できませんでした。"
          );
        }
        /*
         * 古いVRMを削除
         */
        if (vrm) {
          scene.remove(
            vrm.scene
          );
          VRMUtils.deepDispose(
            vrm.scene
          );
        }
        vrm =
          newVrm;
        /*
         * 軽量化
         */
        try {
          VRMUtils.removeUnnecessaryVertices(
            vrm.scene
          );
          VRMUtils.removeUnnecessaryJoints(
            vrm.scene
          );
        } catch (error) {
          console.warn(
            "VRM軽量化処理をスキップ:",
            error
          );
        }
        /*
         * フラスタムカリング対策
         */
        vrm.scene.traverse(
          object => {
            object.frustumCulled =
              false;
          }
        );
        fitVRM(
          vrm
        );
        scene.add(
          vrm.scene
        );
        /*
         * PNG → VRM
         */
        characterArea.classList.add(
          "vrm-mode"
        );
        vrmStatus.textContent =
          "VRMを読み込みました。";
        closeSettings();
        console.log(
          "VRM loaded:",
          vrm
        );
      } catch (error) {
        console.error(
          "VRM読み込みエラー:",
          error
        );
        vrmStatus.textContent =
          "VRMの読み込みに失敗しました。";
        /*
         * エラーでもPNGは残す
         */
        characterArea.classList.remove(
          "vrm-mode"
        );
      }
    }
    /* =========================================================
       VRM FILE BUTTON
    ========================================================= */
    vrmLoadButton.addEventListener(
      "click",
      function() {
        vrmFileInput.value =
          "";
        vrmFileInput.click();
      }
    );
    vrmFileInput.addEventListener(
      "change",
      function() {
        const file =
          vrmFileInput.files?.[0];
        if (file) {
          loadVRMFile(
            file
          );
        }
      }
    );
    /* =========================================================
       PNG MODE
    ========================================================= */
    pngButton.addEventListener(
      "click",
      function() {
        characterArea.classList.remove(
          "vrm-mode"
        );
        vrmStatus.textContent =
          "PNG表示に戻しました。";
      }
    );
    /* =========================================================
       DELETE VRM
    ========================================================= */
    vrmDeleteButton.addEventListener(
      "click",
      function() {
        if (!vrm) {
          vrmStatus.textContent =
            "読み込まれているモデルはありません。";
          return;
        }
        /* シーンから削除 */
        scene.remove(
          vrm.scene
        );
        /* メモリから解放 */
        try {
          VRMUtils.deepDispose(
            vrm.scene
          );
        } catch (error) {
          console.warn(
            "VRM解放処理:",
            error
          );
        }
        /* VRMを完全に解除 */
        vrm = null;
        /* PNG表示へ */
        characterArea.classList.remove(
          "vrm-mode"
        );
        vrmStatus.textContent =
          "モデルを消しました。";
        console.log(
          "VRM: MODEL DELETED"
        );
      }
    );
    /* =========================================================
       START
    ========================================================= */
    console.log(
      "イノチチャット起動完了"
    );
  </script>
 
</body>
