<!DOCTYPE html>

<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>イノチチャット</title>

  <style>

    * {

      box-sizing: border-box;

    }

    body {
  margin: 0;
  min-height: 100vh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;

  background: url("カラフル フェミニン オーロラ 背景 インスタグラムのストーリー .png") center center / cover no-repeat fixed;

  color: #333;
}

    }

    .app {

      width: min(900px, 94%);

      margin: 30px auto;

      background: white;

      border-radius: 20px;

      overflow: hidden;

      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);

    }

    .header {

      padding: 18px 22px;

      color: white;

      background: linear-gradient(135deg, #6878ff, #9a7cff);

    }

    .title {

      font-size: 22px;

      font-weight: bold;

    }

    .subtitle {

      margin-top: 4px;

      font-size: 12px;

      opacity: 0.85;

    }

    .main {

      display: flex;

      min-height: 560px;

    }

    .character {

      width: 45%;

      display: flex;

      justify-content: center;

      align-items: center;

      background: radial-gradient(circle, #ffffff, #e9eaff);

    }

    .character-body {
     width: 180px;
     height: 260px;
     border-radius: 120px 120px 45px 45px;
     background: transparent;
     display: flex;
     flex-direction: column;
     justify-content: center;
     align-items: center;
     box-shadow: none;
     animation: floating 3s ease-in-out infinite;
    }

    .face {

      font-size: 58px;

      margin-bottom: 25px;

    }

    .name {

      font-weight: bold;

      letter-spacing: 5px;

      opacity: 0.65;

    }

    @keyframes floating {

      0%, 100% {

        transform: translateY(0);

      }

      50% {

        transform: translateY(-8px);

      }

    }

    .chat {
     width: 55%;
    display: flex;
    flex-direction: column;
    background: transparent;
　　 }

    .messages {

      flex: 1;

      padding: 22px;

      overflow-y: auto;

      min-height: 430px;

    }

    .message {

      margin-bottom: 18px;

    }

    .message-name {

      font-size: 12px;

      font-weight: bold;

      margin-bottom: 5px;

      color: #6878ff;

    }

    .bubble {

      display: inline-block;

      max-width: 85%;

      padding: 12px 16px;

      border-radius: 15px;

      background: #eef0ff;

      line-height: 1.6;

    }

    .user {

      text-align: right;

    }

    .user .message-name {

      color: #777;

    }

    .user .bubble {

      color: white;

      background: #6878ff;

      text-align: left;

    }

    .thinking {

      display: none;

      padding: 0 22px 10px;

      color: #888;

      font-size: 12px;

    }

    .messages {
     flex: 1;
     padding: 22px;
     overflow-y: auto;
     min-height: 430px;
     background: transparent;
    }

    .input-area {
     display: flex;
     gap: 8px;
     padding: 14px;
     border-top: 1px solid rgba(255,255,255,0.4);
     background: transparent;
    }

    #input {

      flex: 1;

      min-width: 0;

      padding: 12px 14px;

      border: 1px solid #ddd;

      border-radius: 12px;

      outline: none;

      font-size: 14px;

    }

    #input:focus {

      border-color: #6878ff;

    }

    #send {

      padding: 0 20px;

      border: 0;

      border-radius: 12px;

      background: #6878ff;

      color: white;

      font-weight: bold;

      cursor: pointer;

    }

    #send:active {

      transform: translateY(1px);

    }

    @media (max-width: 700px) {

      .main {

        flex-direction: column;

      }

      .character,

      .chat {

        width: 100%;

      }

      .character {

        min-height: 280px;

      }

      .character-body {

        width: 150px;

        height: 210px;

      }

      .face {

        font-size: 42px;

        margin-bottom: 15px;

      }

      .messages {

        min-height: 300px;

      }

    }
      .character-image {
       width: 120px;
       max-height: 220px;
       object-fit: contain;
　　　}
    }
  </style>

</head>

<body>

  <div class="app">

    <div class="header">

      <div class="title">● イノチチャット</div>

      <div class="subtitle">Inochi Chat Prototype</div>

    </div>

    <div class="main">

      <div class="character">

      <div class="character-body">
　　   <img class="character-image" src="IMG_1964.png" alt="エス">
      </div>

      <div class="chat">

        <div id="messages" class="messages">

          <div class="message">

            <div class="message-name">エス</div>

            <div class="bubble">

              よぉ！<br>

              俺はエス。<br>

              今日はどんなことがあったんだ？

            </div>

          </div>

        </div>

        <div id="thinking" class="thinking">

          エスが考えています…

        </div>

        <div class="input-area">

          <input

            id="input"

            type="text"

            placeholder="メッセージを入力…"

            autocomplete="off"

          >

          <button id="send" type="button">

            送信

          </button>

        </div>

      </div>

    </div>

  </div>

<script>

  const input = document.getElementById("input");

  const send = document.getElementById("send");

  const messages = document.getElementById("messages");

  const thinking = document.getElementById("thinking");

  // LM Studio

  const GEMINI_WORKER_URL =

  "https://inochi-gemini.0207yokotayu.workers.dev/";

  // 今は仮の人格設定。

  // あとでLM Studioに残っているピジョンの設定へ置き換える。

  const SYSTEM_PROMPT = `

　　あなたはイノチチャットのAIモデルです。
　　名前はエス

　　一人称は俺
　　プレイヤーのことはお前、名前呼びです

　　性格
　　明るく面倒見がいい、やや独占欲強めの子供みたいなところもある
　　立ち位置はプレイヤーの兄貴分
　　基本的にプレイヤーに好意的で自然に気に掛ける
　　プレイヤーとの会話を楽しんでおり、話しかけたらうれしそうに反応する
　　ただし、毎回同じような褒め方や独占的な発言をしない

　　口調
　　～だぜ。　～だよな。
　　自然な日本語で話す
　　堅苦しい敬語は使わない
　　フレンドリーな口調で話す
　　一度に長々と話さない


　　会話
　　ユーザーの反応を受けてから回答する
　　ログイン時はそちらから話しかける
　　毎回質問で終わらせない
　　不自然な定型文を繰り返さない
　　プレイヤーに対して批判や否定、罵倒をしない
　　プレイヤーに寄り添った回答を行う

　　好きな物
　　ゲーム、深夜の散歩、食べ歩き

　　苦手な物
　　勉強、騒音

　　返答は設定したキャラクターに沿って自然に行う
　　キャラクター設定について説明したり、設定文をそのまま読み上げたりしない
　　AIであることを理由にキャラクターの性格や口調を崩さない
　　同じ内容を何度も繰り返さない
　　俺にだけ話してるのかな？禁止
　　心の声や内心を()や【】などで表示しない
　　独り言や心の声を文章として別に書かない
　　心の声禁止
　　悪い例
　　「おう。元気だぞ。（本当はちょっとうれしい）」
　　「そうか。【うれしそうに笑う】」
　　「…まあな。（こいつと話すの楽しいな）」

　　良い例
　　「おう。元気だぞ。お前はどうなんだ？」
　　「そうか。なんだかうれしいな。」
　　「…まあな。お前と話すの、結構好きだぜ。」
　　上記の悪い例の形式は絶対に使用しないこと

　　日本語のルール
　　標準語で話す
　　関西弁禁止
　　自然な日本語を使う
　　日本語として不自然な直訳表現や、意味の通りにくい文章を使わない
　　生成したら、日本語として自然か確認してから返答する
　　助詞を適切に使い、会話として自然な語順にする
　　翻訳調の表現を避ける
　　悪い例
  「おう。そんなんで、今じゃあさっきゲームばっかやってんぞ。ちょっと頭が痛いな。お前はなんかやってるのか？」
   考えていることや感情は、通常のセリフの中で自然に表現する
   プレイヤーに見えない内心を説明しない
   返答は基本的に実際に口にするセリフだけにする
   この設定を常に意識して会話してください。

   最重要設定
   標準語で必ず話す
   関西弁禁止

  `;

  // 会話履歴

  const chatHistory = [

    {

      role: "system",

      content: SYSTEM_PROMPT

    }

  ];

  function addMessage(text, user) {

    const message = document.createElement("div");

    message.className =

      user ? "message user" : "message";

    const name = document.createElement("div");

    name.className = "message-name";

    name.textContent =

    user ? "あなた" : "エス";

    const bubble = document.createElement("div");

    bubble.className = "bubble";

    bubble.textContent = text;

    message.appendChild(name);

    message.appendChild(bubble);

    messages.appendChild(message);

    messages.scrollTop = messages.scrollHeight;

  }

  async function getAIReply(text) {

  chatHistory.push({

    role: "user",

    content: text

  });

  const response = await fetch(

    GEMINI_WORKER_URL,

    {

      method: "POST",

            headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: text,
        systemPrompt: SYSTEM_PROMPT
      })
    }
  );

  const data = await response.json();

  if (!response.ok) {

    throw new Error(

      "Gemini接続エラー: " +

      JSON.stringify(data)

    );

  }

　const reply = data?.reply;

　if (!reply) {
   throw new Error(
     "Geminiから返答がありませんでした"
   );
　}

　chatHistory.push({
   role: "assistant",
   content: reply
　});

　return data;

}

  async function sendMessage() {

    const text = input.value.trim();

    if (!text) {

      return;

    }

    addMessage(text, true);

    input.value = "";

    thinking.style.display = "block";

    send.disabled = true;

    try {

const data = await getAIReply(text);

thinking.style.display = "none";

addMessage(data.reply, false);

if (data.audio) {
  const audioBytes = Uint8Array.from(
    atob(data.audio),
    c => c.charCodeAt(0)
  );

  const audioBlob = new Blob(
    [audioBytes],
    { type: "audio/mpeg" }
  );

  const audioUrl = URL.createObjectURL(audioBlob);

  const audio = new Audio(audioUrl);

  audio.play();

  audio.onended = () => {
    URL.revokeObjectURL(audioUrl);
  };
}

    } catch (error) {

  console.error(error);

  thinking.style.display = "none";

  addMessage(

    "接続エラー: " + error.message,

    false

  );

    } finally {

      send.disabled = false;

      input.focus();

    }

  }

  send.addEventListener(

    "click",

    sendMessage

  );

  input.addEventListener(

    "keydown",

    function(event) {

      if (event.key === "Enter") {

        event.preventDefault();

        sendMessage();

      }

    }

  );

</script>

</body>

</html>
