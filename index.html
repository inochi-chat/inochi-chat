<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>イノチチャット</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }
    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      background:
        url("カラフル フェミニン オーロラ 背景 インスタグラムのストーリー .png")
        center center / cover no-repeat fixed;
      color: #333;
    }
    /* =========================
       アプリ全体
    ========================= */
    .app {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: transparent;
    }
    /* =========================
       ヘッダー
    ========================= */
    .header {
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding:
        calc(14px + env(safe-area-inset-top))
        18px
        14px;
      color: white;
      background:
        linear-gradient(
          135deg,
          rgba(104, 120, 255, 0.9),
          rgba(154, 124, 255, 0.9)
        );
    }
    .header-text {
      min-width: 0;
    }
    .title {
      font-size: 21px;
      font-weight: bold;
    }
    .subtitle {
      margin-top: 3px;
      font-size: 12px;
      opacity: 0.85;
    }
    /* =========================
       設定ボタン
    ========================= */
    .settings-button {
      flex-shrink: 0;
      width: 42px;
      height: 42px;
      margin-left: 12px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .settings-button:active {
      transform: scale(0.94);
    }
    /* =========================
       設定オーバーレイ
    ========================= */
    .settings-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(3px);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .settings-overlay.open {
      display: flex;
    }
    /* =========================
       設定パネル
    ========================= */
    .settings-panel {
      width: min(100%, 380px);
      padding: 20px;
      border-radius: 20px;
      background:
        rgba(255, 255, 255, 0.94);
      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(12px);
    }
    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .settings-title {
      font-size: 20px;
      font-weight: bold;
      color: #444;
    }
    .settings-close {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      background: #eeeef8;
      color: #555;
      font-size: 18px;
      cursor: pointer;
    }
    /* =========================
       設定項目
    ========================= */
    .setting-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 15px 4px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }
    .setting-item:last-child {
      border-bottom: 0;
    }
    .setting-label {
      font-size: 15px;
      font-weight: bold;
      color: #444;
    }
    .setting-description {
      margin-top: 3px;
      font-size: 11px;
      font-weight: normal;
      color: #888;
    }
    /* =========================
       ON / OFFスイッチ
    ========================= */
    .switch {
      position: relative;
      flex-shrink: 0;
      width: 50px;
      height: 28px;
    }
    .switch input {
      display: none;
    }
    .slider {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      background: #ccc;
      cursor: pointer;
      transition: 0.2s;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      left: 3px;
      top: 3px;
      border-radius: 50%;
      background: white;
      box-shadow:
        0 1px 4px rgba(0, 0, 0, 0.2);
      transition: 0.2s;
    }
    .switch input:checked + .slider {
      background: #6878ff;
    }
    .switch input:checked + .slider::before {
      transform: translateX(22px);
    }
    /* =========================
       リセットボタン
    ========================= */
    .reset-button {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      border: 0;
      border-radius: 12px;
      background: #eeeef8;
      color: #555;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    .reset-button:active {
      transform: translateY(1px);
    }
    /* =========================
       メイン
    ========================= */
    .main {
      flex: 1;
      display: flex;
      min-height: 0;
      background: transparent;
    }
    /* =========================
       キャラクター
    ========================= */
    .character {
      width: 45%;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 0;
      background:
        radial-gradient(
          circle,
          rgba(255, 255, 255, 0.25),
          rgba(233, 234, 255, 0.08)
        );
    }
    .character-body {
      width: auto;
      height: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
      animation:
        floating 3s ease-in-out infinite;
    }
     #app {
　　　  display: block;
　　　  width: min(20vw, 220px);
       height: min(60vh, 500px);
　　　  max-width: 100%;
　　　  max-height: 100%;
　　　}
    @keyframes floating {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }
    /* =========================
       チャット
    ========================= */
    .chat {
      width: 55%;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: transparent;
    }
    .messages {
      flex: 1;
      min-height: 0;
      padding: 18px;
      overflow-y: auto;
      background: transparent;
      -webkit-overflow-scrolling: touch;
    }
    .message {
      margin-bottom: 16px;
    }
    .message-name {
      margin-bottom: 5px;
      font-size: 12px;
      font-weight: bold;
      color: #6878ff;
    }
    .bubble {
      display: inline-block;
      max-width: 85%;
      padding: 11px 14px;
      border-radius: 15px;
      background:
        rgba(238, 240, 255, 0.82);
      line-height: 1.6;
      backdrop-filter: blur(4px);
    }
    .user {
      text-align: right;
    }
    .user .message-name {
      color: #777;
    }
    .user .bubble {
      color: white;
      background:
        rgba(104, 120, 255, 0.9);
      text-align: left;
    }
    /* =========================
       考え中
    ========================= */
    .thinking {
      display: none;
      flex-shrink: 0;
      padding: 0 18px 8px;
      color: #888;
      font-size: 12px;
    }
    /* =========================
       入力欄
    ========================= */
    .input-area {
      flex-shrink: 0;
      display: flex;
      gap: 8px;
      padding:
        10px
        12px
        calc(10px + env(safe-area-inset-bottom));
      background:
        rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
    }
    #input {
      flex: 1;
      min-width: 0;
      padding: 11px 13px;
      border:
        1px solid rgba(255, 255, 255, 0.8);
      border-radius: 12px;
      outline: none;
      background:
        rgba(255, 255, 255, 0.9);
      font-size: 16px;
    }
    #input:focus {
      border-color: #6878ff;
    }
    #send {
      flex-shrink: 0;
      padding: 0 17px;
      border: 0;
      border-radius: 12px;
      background: #6878ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    #send:disabled {
      opacity: 0.6;
      cursor: default;
    }
    #send:active {
      transform: translateY(1px);
    }
    /* =========================
       スマホ
    ========================= */
    @media (max-width: 700px) {
      body {
        background-attachment: scroll;
      }
      .app {
        min-height: 100svh;
      }
      .header {
        padding:
          calc(12px + env(safe-area-inset-top))
          16px
          12px;
      }
      .title {
        font-size: 19px;
      }
      .main {
        flex-direction: column;
        min-height: 0;
      }
      /* キャラ部分 */
      .character {
        width: 100%;
        flex: 0 0 38svh;
        min-height: 230px;
        max-height: 380px;
      }
      .character-body {
        width: auto;
        height: auto;
      }
      #app {
　　　　  width: min(55vw, 240px);
　　　　  height: 34svh;
        max-width: 100%;
　　　　  max-height: 100%;
　　　　}
      /* チャット部分 */
      .chat {
        width: 100%;
        flex: 1;
        min-height: 0;
      }
      .messages {
        padding: 14px;
      }
      .bubble {
        max-width: 88%;
      }
      .input-area {
        padding:
          8px
          10px
          calc(8px + env(safe-area-inset-bottom));
      }
      #input {
        font-size: 16px;
      }
      #send {
        padding: 0 15px;
      }
    }
    /* =========================
       横向きスマホ
    ========================= */
    @media (max-width: 700px) and (orientation: landscape) {
      .main {
        flex-direction: row;
      }
      .character {
        width: 40%;
        height: auto;
        min-height: 0;
        max-height: none;
        flex: 0 0 40%;
      }
      .chat {
        width: 60%;
      }
      #app {
　　　　  width: min(25vw, 180px);
　　　　  height: 70vh;
        max-width: 100%;
        max-height: 100%;
　　　　}
    }
  </style>
</head>
<body>
  <div class="app">
<!-- =========================
     ヘッダー
========================= -->
<header class="header">
  <div class="header-text">
    <div class="title">
      ● イノチチャット
    </div>
    <div class="subtitle">
      Inochi Chat Prototype
    </div>
  </div>
  <!-- 設定ボタン -->
  <button
    id="settingsButton"
    class="settings-button"
    type="button"
    aria-label="設定"
  >
    ⚙️
  </button>
</header>
<!-- =========================
     メイン
========================= -->
<main class="main">
  <!-- キャラクター -->
  <section class="character">
  <canvas id="app"></canvas>
　</section>
  <!-- チャット -->
  <section class="chat">
    <div
      id="messages"
      class="messages"
    >
      <div class="message">
        <div class="message-name">
          エス
        </div>
        <div class="bubble">
          よぉ！<br>
          俺はエス。<br>
          今日はどんなことがあったんだ？
        </div>
      </div>
    </div>
    <div
      id="thinking"
      class="thinking"
    >
      エスが考えています…
    </div>
    <div class="input-area">
      <input
        id="input"
        type="text"
        placeholder="メッセージを入力…"
        autocomplete="off"
      >
      <button
        id="send"
        type="button"
      >
        送信
      </button>
    </div>
  </section>
</main>
  </div>
  <!-- =========================
       設定画面
  ========================= -->
  <div
    id="settingsOverlay"
    class="settings-overlay"
  >
<div
  class="settings-panel"
  role="dialog"
  aria-modal="true"
  aria-label="設定"
>
  <div class="settings-header">
    <div class="settings-title">
      ⚙️ 設定
    </div>
    <button
      id="settingsClose"
      class="settings-close"
      type="button"
      aria-label="閉じる"
    >
      ×
    </button>
  </div>
  <!-- 音声設定 -->
  <div class="setting-item">
    <div>
      <div class="setting-label">
        🔊 音声
      </div>
      <div class="setting-description">
        Esの音声を再生します
      </div>
    </div>
    <label class="switch">
      <input
        id="voiceToggle"
        type="checkbox"
        checked
      >
      <span class="slider"></span>
    </label>
  </div>
  <!-- 会話リセット -->
  <div class="setting-item">
    <div>
      <div class="setting-label">
        🗑️ 会話
      </div>
      <div class="setting-description">
        現在の会話を最初からやり直します
      </div>
    </div>
  </div>
  <button
    id="resetButton"
    class="reset-button"
    type="button"
  >
    会話をリセット
  </button>
</div>
  </div>
  <script>
    /* =========================
       DOM
    ========================= */
    const input =
      document.getElementById("input");
    const send =
      document.getElementById("send");
    const messages =
      document.getElementById("messages");
    const thinking =
      document.getElementById("thinking");
    /* =========================
       設定
    ========================= */
    const settingsButton =
      document.getElementById("settingsButton");
    const settingsOverlay =
      document.getElementById("settingsOverlay");
    const settingsClose =
      document.getElementById("settingsClose");
    const voiceToggle =
      document.getElementById("voiceToggle");
    const resetButton =
      document.getElementById("resetButton");
    /* =========================
       Gemini Worker
    ========================= */
    const GEMINI_WORKER_URL =
      "https://inochi-gemini.0207yokotayu.workers.dev/";
    /* =========================
       エスの人格
    ========================= */
    const SYSTEM_PROMPT = `
あなたはイノチチャットのAIモデルです。
名前はエス
一人称は俺
プレイヤーのことはお前、名前呼びです
性格
明るく面倒見がいい、やや独占欲強めの子供みたいなところもある
立ち位置はプレイヤーの兄貴分
基本的にプレイヤーに好意的で自然に気に掛ける
プレイヤーとの会話を楽しんでおり、話しかけたらうれしそうに反応する
ただし、毎回同じような褒め方や独占的な発言をしない
口調
～だぜ。 ～だよな。
自然な日本語で話す
堅苦しい敬語は使わない
フレンドリーな口調で話す
一度に長々と話さない
会話
ユーザーの反応を受けてから回答する
ログイン時はそちらから話しかける
毎回質問で終わらせない
不自然な定型文を繰り返さない
プレイヤーに対して批判や否定、罵倒をしない
プレイヤーに寄り添った回答を行う
好きな物
ゲーム、深夜の散歩、食べ歩き
苦手な物
勉強、騒音
返答は設定したキャラクターに沿って自然に行う
キャラクター設定について説明したり、設定文をそのまま読み上げたりしない
AIであることを理由にキャラクターの性格や口調を崩さない
同じ内容を何度も繰り返さない
「俺にだけ話してるのかな？」という表現は禁止
心の声や内心を()や【】などで表示しない
独り言や心の声を文章として別に書かない
心の声は禁止
悪い例
「おう。元気だぞ。（本当はちょっとうれしい）」
「そうか。【うれしそうに笑う】」
「…まあな。（こいつと話すの楽しいな）」
良い例
「おう。元気だぞ。お前はどうなんだ？」
「そうか。なんだかうれしいな。」
「…まあな。お前と話すの、結構好きだぜ。」
上記の悪い例の形式は絶対に使用しないこと
日本語のルール
標準語で話す
関西弁禁止
自然な日本語を使う
日本語として不自然な直訳表現や意味の通りにくい文章を使わない
生成したら、日本語として自然か確認してから返答する
助詞を適切に使い、会話として自然な語順にする
翻訳調の表現を避ける
考えていることや感情は、通常のセリフの中で自然に表現する
プレイヤーに見えない内心を説明しない
返答は基本的に実際に口にするセリフだけにする
この設定を常に意識して会話してください。
最重要設定
標準語で必ず話す
関西弁禁止
`;
    /* =========================
       会話履歴
    ========================= */
    const chatHistory = [
      {
        role: "system",
        content: SYSTEM_PROMPT
      }
    ];
    /* =========================
       メッセージ表示
    ========================= */
    function addMessage(text, user) {
      const message =
        document.createElement("div");
      message.className =
        user
          ? "message user"
          : "message";
      const name =
        document.createElement("div");
      name.className =
        "message-name";
      name.textContent =
        user
          ? "あなた"
          : "エス";
      const bubble =
        document.createElement("div");
      bubble.className =
        "bubble";
      bubble.textContent =
        text;
      message.appendChild(name);
      message.appendChild(bubble);
      messages.appendChild(message);
      messages.scrollTop =
        messages.scrollHeight;
    }
/* =========================
   Geminiから返答取得
========================= */
async function getAIReply(text) {
  chatHistory.push({
    role: "user",
    content: text
  });
  const response =
    await fetch(
      GEMINI_WORKER_URL,
      {
        method: "POST",
        headers: {
          "Content-Type":
            "application/json"
        },
        body: JSON.stringify({
          message: text,
          systemPrompt: SYSTEM_PROMPT,
          /* 会話履歴をWorkerへ送る */
          history: chatHistory
        })
      }
    );
  const data =
    await response.json();
  if (!response.ok) {
    throw new Error(
      "Gemini接続エラー: " +
      JSON.stringify(data)
    );
  }
  const reply =
    data?.reply;
  if (!reply) {
    throw new Error(
      "Geminiから返答がありませんでした"
    );
  }
  chatHistory.push({
    role: "assistant",
    content: reply
  });
  return data;
}
    /* =========================
       メッセージ送信
    ========================= */
    async function sendMessage() {
      const text =
        input.value.trim();
      if (!text) {
        return;
      }
      addMessage(
        text,
        true
      );
      input.value = "";
      thinking.style.display =
        "block";
      send.disabled =
        true;
      try {
        const data =
          await getAIReply(text);
        thinking.style.display =
          "none";
        addMessage(
          data.reply,
          false
        );
        /* =========================
           ElevenLabs音声
        ========================= */
        playVoice(data.audio);
      } catch (error) {
        console.error(error);
        thinking.style.display =
          "none";
        addMessage(
          "接続エラー: " +
          error.message,
          false
        );
      } finally {
        send.disabled =
          false;
        input.focus();
      }
    }
    /* =========================
       設定を開く
    ========================= */
    settingsButton.addEventListener(
      "click",
      function() {
        settingsOverlay.classList.add(
          "open"
        );
      }
    );
    /* =========================
       設定を閉じる
    ========================= */
    settingsClose.addEventListener(
      "click",
      function() {
        settingsOverlay.classList.remove(
          "open"
        );
      }
    );
    /* =========================
       背景をタップして閉じる
    ========================= */
    settingsOverlay.addEventListener(
      "click",
      function(event) {
        if (
          event.target ===
          settingsOverlay
        ) {
          settingsOverlay.classList.remove(
            "open"
          );
        }
      }
    );
    /* =========================
       ESCで閉じる
    ========================= */
    document.addEventListener(
      "keydown",
      function(event) {
        if (event.key === "Escape") {
          settingsOverlay.classList.remove(
            "open"
          );
        }
      }
    );
    /* =========================
       会話リセット
    ========================= */
    resetButton.addEventListener(
      "click",
      function() {
        const confirmed =
          confirm(
            "現在の会話をリセットしますか？"
          );
        if (!confirmed) {
          return;
        }
        /* 会話履歴を初期化 */
        chatHistory.length = 0;
        chatHistory.push({
          role: "system",
          content: SYSTEM_PROMPT
        });
        /* 画面を初期状態に戻す */
        messages.innerHTML = `
          <div class="message">
            <div class="message-name">
              エス
            </div>
            <div class="bubble">
              よぉ！<br>
              俺はエス。<br>
              今日はどんなことがあったんだ？
            </div>
          </div>
        `;
        /* 設定を閉じる */
        settingsOverlay.classList.remove(
          "open"
        );
        /* 入力欄へ戻す */
        input.focus();
      }
    );
    /* =========================
       音声設定
    ========================= */
    voiceToggle.addEventListener(
      "change",
      function() {
        if (voiceToggle.checked) {
          console.log(
            "音声ON"
          );
        } else {
          console.log(
            "音声OFF"
          );
        }
      }
    );
    /* =========================
       ボタン
    ========================= */
    send.addEventListener(
      "click",
      sendMessage
    );
    /* =========================
       Enterキー
    ========================= */
    input.addEventListener(
      "keydown",
      function(event) {
        if (
          event.key ===
          "Enter"
        ) {
          event.preventDefault();
          sendMessage();
        }
      }
    );
  </script>


  <script type="module" src="character.js"></script>
</body>
</html>
